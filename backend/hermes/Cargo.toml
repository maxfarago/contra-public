[package]
name = "hermes"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlx = { version = "0.7", default-features = false, features = ["postgres", "runtime-tokio-rustls", "macros"] }
tokio = { version = "1", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- local dependencies ---
commons = { path = "../commons" }